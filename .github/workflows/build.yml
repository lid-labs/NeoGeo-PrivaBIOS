#
# Builds the BIOS image in Docker, checks its SHA-256 against build/expected-sha256.txt, and runs the
# generators' tests. MAME is not run here: the scenes need ROM sets, which this repository never
# provides (see docs/BENCH.md).
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Contract generator tests
        run: python3 -I bench/test_generer_contrats.py

      - name: Sine table matches its generator
        run: python3 -I -B bench/generer-sinus.py --verifier

      - name: Build the image
        run: |
          BIOS_OBJ=obj ./build/construire.sh src/c0 sprixe-bios.sp1
          sha256sum sprixe-bios.sp1

      - name: Image matches build/expected-sha256.txt
        run: |
          read -r attendu < build/expected-sha256.txt
          echo "$attendu  sprixe-bios.sp1" | sha256sum -c -

      - uses: actions/upload-artifact@v4
        with:
          name: sprixe-bios
          path: sprixe-bios.sp1
