#
# Checks that no tracked file carries private data (bench/garde-publication.sh), builds the BIOS
# image in Docker, checks its SHA-256 against build/expected-sha256.txt, and runs the generators'
# tests. MAME is not run here: the scenes need ROM sets, which this repository never
# provides (see docs/BENCH.md). release.yml calls this workflow and publishes its artifact: a check
# added here also guards every release.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: No private data in tracked files
        run: bench/garde-publication.sh

      - name: Contract generator tests
        run: python3 -I bench/test_generer_contrats.py

      - name: Sine table matches its generator
        run: python3 -I -B bench/generer-sinus.py --verifier

      - name: Mutation passages match the sources
        run: python3 -I -B bench/parcours-mutations.py --verifier

      - name: Build the image
        run: |
          BIOS_OBJ=obj ./build/construire.sh src/c0 privabios.sp1
          sha256sum privabios.sp1

      - name: Image matches build/expected-sha256.txt
        run: |
          read -r attendu < build/expected-sha256.txt
          echo "$attendu  privabios.sp1" | sha256sum -c -

      - name: The slot diagnostic image and the harness still link
        run: |
          BIOS_OBJ=obj-diag ./build/construire.sh diag/slots diag-slots.sp1
          BIOS_OBJ=obj-harnais ./build/construire.sh build/harnais harnais.sp1

      - uses: actions/upload-artifact@v4
        with:
          name: privabios
          path: privabios.sp1
